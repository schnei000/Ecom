services:
  - type: web
    name: bouticlakay-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 4 -b 0.0.0.0:$PORT app:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bouticlakay-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://your-app.vercel.app  # REMPLACER par l'URL Vercel réelle après déploiement frontend
      - key: RATELIMIT_STORAGE_URI
        value: memory://  # Remplacer par une URL Redis (ex: redis://...) pour la production à grande échelle

databases:
  - name: bouticlakay-db
    databaseName: bouticlakay
    user: bouticlakay_user
