services:
  - type: web
    name: bouticlakay-api
    runtime: python
    buildCommand: pip install -r Backend/requirements.txt
    startCommand: cd Backend && gunicorn -w 4 -b 0.0.0.0:$PORT wsgi:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        sync: false  # À définir manuellement dans le dashboard Render
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false  # À définir manuellement avec l'URL Vercel
      - key: RATELIMIT_STORAGE_URI
        value: memory://
